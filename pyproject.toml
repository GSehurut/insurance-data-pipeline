[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "insurance-data-pipeline"
version = "0.1.0"
description = "Map, validate and standardise insurance bordereaux and claims data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Goabaone Sehurutshe" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyyaml>=6"]
keywords = ["insurance", "bordereaux", "data quality", "data engineering", "lloyds"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Database",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
excel = ["openpyxl>=3.1"]

[project.scripts]
idp = "insurance_data_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/GSehurut/insurance-data-pipeline"
Issues = "https://github.com/GSehurut/insurance-data-pipeline/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_data_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
